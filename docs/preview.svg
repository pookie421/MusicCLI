      <text x="0" y="32" class="t-bold">│ Phrozen — Phonky Business                                                                    │</text>
      <text x="0" y="52" class="t-norm">│ PLAYING [███████████████░░░░░░░░░░░░░░░░░░░░░░░░░░░░] 00:24 / 02:08                        │</text>
