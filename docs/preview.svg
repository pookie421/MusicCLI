      <text x="0" y="124" class="t-dim">│                                           │</text>
      <text x="0" y="142" class="t-dim">│                                           │</text>
      <text x="0" y="160" class="t-dim">│                                           │</text>
      <text x="0" y="178" class="t-dim">│                                           │</text>
      <text x="0" y="196" class="t-dim">└───────────────────────────────────────────┘</text>
    </g>

