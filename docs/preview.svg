      <text x="0" y="30" class="t-norm">│ <tspan class="t-bold">     ▄        </tspan> │ <tspan class="t-bold">[PLAY] Phrozen - Phonky Business</tspan>                     <tspan class="t-bold">[FLAC 588k / STEREO]</tspan> │</text>
      <text x="0" y="48" class="t-norm">│ <tspan class="t-bold">   ▀▄▀█ █ ▀ ▀ </tspan> │ ALBUM: Phonky Business - Single (2023)  GENRE: Phonk                            │</text>
      <text x="0" y="66" class="t-norm">│ <tspan class="t-bold">  ▀ ▄▀ ▀ ▀▄▀ ▀</tspan> │ 00:24 [████████████████▓░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░] 02:08 (-01:44) 18.7% │</text>
      <text x="0" y="84" class="t-norm">│ <tspan class="t-bold">  ▄     ▀   ▀ </tspan> │ VOL:[███████░░░] 70%  │  LOOP:OFF  │  SHUF:OFF  │  TRK:01/02  │  <tspan class="t-bold">[V] COVER</tspan>       │</text>
